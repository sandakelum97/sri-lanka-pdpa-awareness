<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" role="img" aria-labelledby="t d"><title id="t">Where personal data changes hands every day</title><desc id="d">Five everyday places drawn as simple icons on cards: a pharmacy counter, a tuition class register, a phone receiving a message, a CCTV camera, and a delivery parcel with an address label.</desc>
<defs><style>.c{fill:#FFFFFF}.k{fill:#14213D}.g{fill:#0F6E6B}.y{fill:#F2B33D}.m{fill:#DCE8E6}.r{fill:#A62639}.t{font-family:'Noto Sans','Noto Sans Sinhala',sans-serif;font-size:15px;font-weight:700;fill:#14213D}.s{font-family:'Noto Sans Sinhala','Noto Sans',sans-serif;font-size:13px;fill:#0F6E6B}</style></defs>
<g transform="translate(40,40)"><rect width="200" height="340" rx="18" class="c"/><rect x="30" y="40" width="140" height="90" rx="10" class="m"/><rect x="50" y="60" width="100" height="14" rx="7" class="g"/><rect x="50" y="84" width="60" height="14" rx="7" class="y"/><rect x="70" y="150" width="60" height="40" rx="6" class="k"/><text x="100" y="176" text-anchor="middle" font-family="Noto Sans" font-size="13" font-weight="700" fill="#F2B33D">NIC?</text><text x="100" y="250" text-anchor="middle" class="t">Pharmacy</text><text x="100" y="275" text-anchor="middle" class="s">ෆාමසිය</text><text x="100" y="310" text-anchor="middle" font-family="Noto Sans" font-size="12" fill="#5A6A78">Why do you need my NIC?</text></g>
<g transform="translate(270,40)"><rect width="200" height="340" rx="18" class="c"/><rect x="35" y="40" width="130" height="150" rx="8" class="m"/><rect x="50" y="60" width="100" height="10" rx="5" class="k"/><rect x="50" y="82" width="80" height="10" rx="5" class="g"/><rect x="50" y="104" width="100" height="10" rx="5" class="k"/><rect x="50" y="126" width="70" height="10" rx="5" class="g"/><rect x="50" y="148" width="90" height="10" rx="5" class="k"/><circle cx="150" cy="150" r="22" class="y"/><text x="150" y="156" text-anchor="middle" font-family="Noto Sans" font-size="14" font-weight="700" fill="#14213D">16</text><text x="100" y="250" text-anchor="middle" class="t">Tuition class</text><text x="100" y="275" text-anchor="middle" class="s">උපකාරක පන්තිය</text><text x="100" y="310" text-anchor="middle" font-family="Noto Sans" font-size="12" fill="#5A6A78">Children's data is special</text></g>
<g transform="translate(500,40)"><rect width="200" height="340" rx="18" class="c"/><rect x="65" y="35" width="70" height="140" rx="12" class="k"/><rect x="73" y="50" width="54" height="100" rx="6" class="c"/><rect x="80" y="65" width="40" height="22" rx="6" class="y"/><rect x="80" y="95" width="40" height="22" rx="6" class="m"/><rect x="80" y="125" width="40" height="22" rx="6" class="m"/><circle cx="160" cy="48" r="14" class="r"/><text x="160" y="53" text-anchor="middle" font-family="Noto Sans" font-size="12" font-weight="700" fill="#fff">3</text><text x="100" y="250" text-anchor="middle" class="t">Your phone</text><text x="100" y="275" text-anchor="middle" class="s">ඔබේ දුරකථනය</text><text x="100" y="310" text-anchor="middle" font-family="Noto Sans" font-size="12" fill="#5A6A78">Offers you never asked for</text></g>
<g transform="translate(730,40)"><rect width="200" height="340" rx="18" class="c"/><rect x="92" y="60" width="16" height="110" rx="4" class="k"/><rect x="50" y="50" width="100" height="34" rx="10" class="g"/><circle cx="142" cy="67" r="9" class="y"/><path d="M152 67 L190 110 L190 24 Z" fill="#F2B33D" opacity=".25"/><rect x="40" y="170" width="120" height="30" rx="6" class="m"/><text x="100" y="190" text-anchor="middle" font-family="Noto Sans" font-size="11" font-weight="700" fill="#14213D">CCTV IN OPERATION</text><text x="100" y="250" text-anchor="middle" class="t">The shop camera</text><text x="100" y="275" text-anchor="middle" class="s">කඩයේ කැමරාව</text><text x="100" y="310" text-anchor="middle" font-family="Noto Sans" font-size="12" fill="#5A6A78">Your face is personal data</text></g>
<g transform="translate(960,40)"><rect width="200" height="340" rx="18" class="c"/><rect x="45" y="55" width="110" height="90" rx="8" class="y"/><rect x="45" y="55" width="110" height="24" rx="8" class="k"/><rect x="60" y="95" width="80" height="8" rx="4" class="k"/><rect x="60" y="111" width="60" height="8" rx="4" class="k"/><rect x="60" y="127" width="70" height="8" rx="4" class="k"/><path d="M70 170 h60 l10 20 h-80z" class="g"/><text x="100" y="250" text-anchor="middle" class="t">Home delivery</text><text x="100" y="275" text-anchor="middle" class="s">ගෙදරට බෙදාහැරීම</text><text x="100" y="310" text-anchor="middle" font-family="Noto Sans" font-size="12" fill="#5A6A78">Who else sees your address?</text></g>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 300" role="img" aria-labelledby="t"><title id="t">What to do when customer data is lost or leaked</title>
<defs><style>.t{font-family:Noto Sans,sans-serif}.k{fill:#14213D}.c{fill:#fff;stroke:#A62639;stroke-width:3}</style></defs>
<rect width="1000" height="300" fill="#fff"/>
<g class="t">
<text x="500" y="40" text-anchor="middle" font-size="18" font-weight="700" fill="#A62639">A phone is stolen. A list is emailed to the wrong person. Now what?</text>
<g transform="translate(40,80)"><rect width="200" height="140" rx="12" class="c"/><text x="100" y="40" text-anchor="middle" font-size="16" font-weight="700" class="k">1. Contain</text><text x="100" y="70" text-anchor="middle" font-size="13" class="k">Change passwords.</text><text x="100" y="90" text-anchor="middle" font-size="13" class="k">Remote-wipe the phone.</text><text x="100" y="110" text-anchor="middle" font-size="13" class="k">Recall the email.</text></g>
<g transform="translate(280,80)"><rect width="200" height="140" rx="12" class="c"/><text x="100" y="40" text-anchor="middle" font-size="16" font-weight="700" class="k">2. Write it down</text><text x="100" y="70" text-anchor="middle" font-size="13" class="k">What, when, whose data,</text><text x="100" y="90" text-anchor="middle" font-size="13" class="k">what you did.</text><text x="100" y="110" text-anchor="middle" font-size="13" class="k">The Act expects a record.</text></g>
<g transform="translate(520,80)"><rect width="200" height="140" rx="12" class="c"/><text x="100" y="40" text-anchor="middle" font-size="16" font-weight="700" class="k">3. Could people be hurt?</text><text x="100" y="70" text-anchor="middle" font-size="13" class="k">Fraud, embarrassment,</text><text x="100" y="90" text-anchor="middle" font-size="13" class="k">a child's details?</text><text x="100" y="110" text-anchor="middle" font-size="13" class="k">Tell them. Help them act.</text></g>
<g transform="translate(760,80)"><rect width="200" height="140" rx="12" class="c"/><text x="100" y="40" text-anchor="middle" font-size="16" font-weight="700" class="k">4. Notify the Authority</text><text x="100" y="70" text-anchor="middle" font-size="13" class="k">Required from 1 Jan 2027 (s.23).</text><text x="100" y="90" text-anchor="middle" font-size="13" class="k">Form and deadline: rules not</text><text x="100" y="110" text-anchor="middle" font-size="13" class="k">yet made. "72 hours" is a draft.</text></g>
<text x="500" y="265" text-anchor="middle" font-size="13" fill="#5b6b7b">Self-reporting counts in your favour if a penalty is ever set (s.39(f) — Part VII not in force).</text>
</g></svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 300" role="img" aria-labelledby="t d"><title id="t">Everyday places where personal data changes hands</title><desc id="d">A pharmacy counter, a tuition class, a person on a phone, a CCTV camera, and a delivery rider, drawn in flat shapes.</desc>
<defs><style>.k{fill:#14213D}.g{fill:#0F6E6B}.y{fill:#F2B33D}.w{fill:#fff}.m{fill:#CFE3E1}.s{fill:#7FB7B3}.r{fill:#E07A5F}</style></defs>
<rect width="1200" height="300" fill="#0F6E6B"/>
<rect y="230" width="1200" height="70" fill="#0C5A58"/>
<!-- pharmacy -->
<rect x="40" y="90" width="230" height="140" class="w" opacity=".95"/><rect x="40" y="70" width="230" height="30" class="y"/><text x="155" y="92" text-anchor="middle" font-family="Noto Sans,sans-serif" font-size="16" font-weight="700" class="k">PHARMACY · ෆාමසිය</text>
<rect x="60" y="150" width="190" height="80" class="m"/><rect x="70" y="120" width="40" height="20" class="s"/><rect x="120" y="120" width="40" height="20" class="r"/><rect x="170" y="120" width="40" height="20" class="s"/>
<circle cx="110" cy="175" r="14" class="k"/><rect x="96" y="189" width="28" height="41" class="g"/>
<circle cx="190" cy="178" r="14" class="k"/><rect x="176" y="192" width="28" height="38" class="r"/>
<rect x="128" y="196" width="36" height="22" rx="3" class="w" stroke="#14213D" stroke-width="2"/><text x="146" y="211" text-anchor="middle" font-size="10" font-family="Noto Sans,sans-serif" class="k">NIC?</text>
<!-- tuition class -->
<rect x="330" y="110" width="200" height="120" class="w" opacity=".95"/><rect x="345" y="125" width="170" height="60" class="k"/><text x="430" y="150" text-anchor="middle" font-family="Noto Sans,sans-serif" font-size="12" fill="#F2B33D">x² + y² = ?</text><text x="430" y="172" text-anchor="middle" font-family="Noto Sans Sinhala,Noto Sans,sans-serif" font-size="12" fill="#fff">ගණිතය 10 ශ්‍රේණිය</text>
<circle cx="365" cy="205" r="9" class="k"/><circle cx="400" cy="205" r="9" class="k"/><circle cx="435" cy="205" r="9" class="k"/><circle cx="470" cy="205" r="9" class="k"/><circle cx="505" cy="205" r="9" class="k"/>
<rect x="355" y="214" width="20" height="16" class="s"/><rect x="390" y="214" width="20" height="16" class="r"/><rect x="425" y="214" width="20" height="16" class="y"/><rect x="460" y="214" width="20" height="16" class="s"/><rect x="495" y="214" width="20" height="16" class="r"/>
<!-- person on phone -->
<circle cx="620" cy="120" r="22" class="y"/><rect x="598" y="142" width="44" height="88" rx="8" class="k"/><rect x="636" y="150" width="22" height="40" rx="4" class="w" stroke="#14213D" stroke-width="3"/><circle cx="647" cy="186" r="2" class="k"/>
<path d="M670 160 q25 -30 55 0" fill="none" stroke="#F2B33D" stroke-width="4" stroke-linecap="round"/><path d="M680 140 q35 -45 80 0" fill="none" stroke="#F2B33D" stroke-width="3" stroke-linecap="round" opacity=".7"/>
<!-- CCTV -->
<rect x="790" y="60" width="12" height="60" class="k"/><rect x="760" y="60" width="72" height="22" rx="6" class="w"/><circle cx="828" cy="71" r="7" class="r"/><path d="M835 71 L920 120 L920 40 Z" fill="#F2B33D" opacity=".25"/>
<!-- delivery rider -->
<circle cx="1010" cy="200" r="28" fill="none" stroke="#14213D" stroke-width="8"/><circle cx="1110" cy="200" r="28" fill="none" stroke="#14213D" stroke-width="8"/><path d="M1010 200 L1050 140 L1095 140 L1110 200" fill="none" stroke="#14213D" stroke-width="8" stroke-linejoin="round"/><rect x="1060" y="100" width="46" height="36" rx="4" class="y"/><circle cx="1050" cy="118" r="14" class="w"/><rect x="1040" y="132" width="20" height="30" class="r"/>
<rect x="1062" y="104" width="42" height="12" class="k"/><text x="1083" y="114" text-anchor="middle" font-size="9" font-family="Noto Sans,sans-serif" fill="#F2B33D">ADDRESS</text>

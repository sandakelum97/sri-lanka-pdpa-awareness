<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 360" role="img" aria-labelledby="t"><title id="t">Timeline of the Personal Data Protection Act: which parts are in force and when</title>
<defs><style>.k{fill:#14213D}.g{fill:#0F6E6B}.y{fill:#F2B33D}.r{fill:#A62639}.t{font-family:Noto Sans,sans-serif}</style></defs>
<rect width="1000" height="360" fill="#fff"/>
<line x1="60" y1="200" x2="940" y2="200" stroke="#CFE3E1" stroke-width="10" stroke-linecap="round"/>
<g class="t" font-size="14">
<circle cx="100" cy="200" r="14" class="g"/><text x="100" y="150" text-anchor="middle" font-weight="700" class="k">19 Mar 2022</text><text x="100" y="170" text-anchor="middle" fill="#14213D">Act certified</text><text x="100" y="240" text-anchor="middle" fill="#0F6E6B">only s.1 in force</text>
<circle cx="300" cy="200" r="14" class="g"/><text x="300" y="150" text-anchor="middle" font-weight="700" class="k">17 Jul 2023</text><text x="300" y="170" text-anchor="middle" class="k">Regulator created</text><text x="300" y="240" text-anchor="middle" fill="#0F6E6B">Part V · Gazette 2341/59</text>
<circle cx="440" cy="200" r="14" class="g"/><text x="440" y="150" text-anchor="middle" font-weight="700" class="k">1 Dec 2023</text><text x="440" y="170" text-anchor="middle" class="k">Staff, fund, rules</text><text x="440" y="240" text-anchor="middle" fill="#0F6E6B">Parts VI, VIII, IX, X</text>
<g><circle cx="580" cy="200" r="14" fill="#fff" stroke="#A62639" stroke-width="4"/><line x1="568" y1="188" x2="592" y2="212" stroke="#A62639" stroke-width="4"/><line x1="592" y1="188" x2="568" y2="212" stroke="#A62639" stroke-width="4"/><text x="580" y="150" text-anchor="middle" font-weight="700" fill="#A62639">18 Mar 2025</text><text x="580" y="170" text-anchor="middle" fill="#A62639">cancelled</text><text x="580" y="240" text-anchor="middle" fill="#A62639">Gazette 2427/34 repealed it</text></g>
<circle cx="760" cy="200" r="16" class="y"/><text x="760" y="150" text-anchor="middle" font-weight="700" class="k">1 Jan 2027</text><text x="760" y="170" text-anchor="middle" class="k">Duties on businesses begin</text><text x="760" y="240" text-anchor="middle" fill="#8a6200">ss.2–3, Part I, Part III · Gazette 2498/16</text>
<circle cx="920" cy="200" r="14" fill="#fff" stroke="#A62639" stroke-width="4" stroke-dasharray="6 5"/><text x="920" y="150" text-anchor="middle" font-weight="700" fill="#A62639">No date</text><text x="920" y="170" text-anchor="middle" fill="#A62639">Your rights, marketing</text><text x="920" y="240" text-anchor="middle" fill="#A62639">rules, fines</text><text x="920" y="260" text-anchor="middle" fill="#A62639">Parts II, IV, VII</text>
<text x="500" y="320" text-anchor="middle" font-size="13" fill="#5b6b7b">Checked against the official Gazettes on 31 October 2026 · Mage Datta</text>
</g></svg>

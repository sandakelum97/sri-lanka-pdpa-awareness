<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 380" role="img" aria-labelledby="t"><title id="t">The rights the Act gives individuals, none yet in force</title>
<defs><style>.t{font-family:Noto Sans,sans-serif}.k{fill:#14213D}.c{fill:#fff;stroke:#CFE3E1;stroke-width:2}</style></defs>
<rect width="1000" height="380" fill="#fff"/>
<g class="t">
<rect x="30" y="20" width="940" height="46" rx="10" fill="#FDECED"/><text x="500" y="50" text-anchor="middle" font-size="16" font-weight="700" fill="#A62639">Part II — written into the Act, not yet in force. No start date has been set.</text>
<g transform="translate(30,90)"><rect width="300" height="120" rx="12" class="c"/><text x="20" y="34" font-size="16" font-weight="700" class="k">See your data (s.13)</text><text x="20" y="60" font-size="13" class="k">Ask any organisation what it holds about you,</text><text x="20" y="80" font-size="13" class="k">why, and who it shares it with.</text></g>
<g transform="translate(350,90)"><rect width="300" height="120" rx="12" class="c"/><text x="20" y="34" font-size="16" font-weight="700" class="k">Correct it (s.15)</text><text x="20" y="60" font-size="13" class="k">Wrong date of birth, old address, a mistake</text><text x="20" y="80" font-size="13" class="k">in your file — they must fix it.</text></g>
<g transform="translate(670,90)"><rect width="300" height="120" rx="12" class="c"/><text x="20" y="34" font-size="16" font-weight="700" class="k">Say no (s.14)</text><text x="20" y="60" font-size="13" class="k">Take back consent you gave. Object when</text><text x="20" y="80" font-size="13" class="k">they rely on "legitimate interests".</text></g>
<g transform="translate(30,230)"><rect width="300" height="120" rx="12" class="c"/><text x="20" y="34" font-size="16" font-weight="700" class="k">Delete it (s.16)</text><text x="20" y="60" font-size="13" class="k">Only in three cases: they broke the rules,</text><text x="20" y="80" font-size="13" class="k">you withdrew consent, or a law says so.</text></g>
<g transform="translate(350,230)"><rect width="300" height="120" rx="12" class="c"/><text x="20" y="34" font-size="16" font-weight="700" class="k">A human looks again (s.18)</text><text x="20" y="60" font-size="13" class="k">If a computer alone made a serious, lasting</text><text x="20" y="80" font-size="13" class="k">decision about you.</text></g>
<g transform="translate(670,230)"><rect width="300" height="120" rx="12" fill="#0F6E6B"/><text x="20" y="34" font-size="16" font-weight="700" fill="#fff">An answer in one month (s.17)</text><text x="20" y="60" font-size="13" fill="#fff">Free. In writing. With reasons if refused,</text><text x="20" y="80" font-size="13" fill="#fff">and told you can appeal to the Authority (s.19).</text></g>
</g></svg>
